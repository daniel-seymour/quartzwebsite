  author: "Daniel Seymour"
- text: |
    what are some systemic reasons that you might have chosen the news as your coping mechanism:
    1. Makes me feel important as the events in the news are of global significance, even though almost always don't affect me directly  
    2. I have a good memory and I have read a lot so I can find something that is interesting almost always
    3. Uses not that much brain power but just enough so that it can distract from the pain I have experienced (while still not being as effective as a more calming coping strategy which normally involves confronting the root cause of the pain)
    4. Grew up with my Dad having a long term habit of reading the news incessantly so easy for me to copy
    5. There is an illusion of infinite depth of potential analysis which appeals to my analytical side
