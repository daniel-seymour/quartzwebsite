- text: |
    High performance coaches: What I hear from both coaches is always tightly focused on performance and avoids any blame or judgment of the players

    It’s an ongoing analysis of what’s working, what needs to improve and what they will change – the three critical questions of a high-performance mindset that elite athletes and coaches use all the time to maintain and drive ever-higher standards, regardless of whether you’re winning or losing. It’s a strong characteristic of a performance environment that is positive, safe and ambitious and necessarily founded on radical candour to tell it how it is.
